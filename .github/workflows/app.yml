# Checks the Expo app on every change: dependency health (expo-doctor), typecheck, and a web build of the bundle
# (proves the app and the shared schema compile together). Store builds run on EAS with the owner's account.
name: App checks

on:
  pull_request:
    paths: ['app/**', 'packages/shared/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', 'packages/shared/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Expo doctor
        run: npx --yes expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle (web export)
        run: npx expo export --platform web --output-dir /tmp/app-web
