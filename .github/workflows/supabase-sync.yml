# Keeps the Supabase project (koko, eu-west-1) in step with main:
#   1. applies new database migrations (supabase db push);
#   2. imports content/**, audio/** and media/** into the database (scripts/import-json.ts).
# Runs on every push to main that touches those paths, and by hand (Actions → Sync to Supabase → Run workflow).
# Secrets (Settings → Secrets and variables → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD.
# Until they are added, the workflow does nothing and says so.
name: Sync to Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/seed/**', 'supabase/functions/**', 'content/**', 'audio/**', 'media/**', 'scripts/**',
            'packages/shared/**', '.github/workflows/supabase-sync.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: show what would change, then roll back'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-sync
  cancel-in-progress: false   # never cut a migration or an import in half

env:
  SUPABASE_PROJECT_REF: pwgkxdiwqrxkndkyzwlw   # not a secret: it is part of the public project URL

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check that the secrets are set
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_PASSWORD" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are not both set yet: nothing was synced."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          fetch-depth: 0   # the import dates pre-dashboard sacred approvals from git history

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.54.11

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Validate content before touching the database
        if: steps.secrets.outputs.ready == 'true'
        run: npm run validate

      - name: Link the project
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          if [ ! -s supabase/.temp/pooler-url ]; then
            # older/newer CLI without the cached pooler URL: ask the Management API for the session pooler
            curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" \
              | jq -r '[.[] | select(.database_type == "PRIMARY")][0] | "postgresql://\(.db_user)@\(.db_host):5432/\(.db_name)"' \
              > supabase/.temp/pooler-url
          fi

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
          else
            supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Deploy the Edge Functions (dashboard, parents, store webhooks)
        if: steps.secrets.outputs.ready == 'true' && inputs.dry_run != true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.KOKO_DISPATCH_TOKEN }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          STRIPE_PORTAL_LOGIN_URL: ${{ vars.STRIPE_PORTAL_LOGIN_URL }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
        run: |
          supabase functions deploy admin-invite request-export parent-signin parent-delete stripe-checkout stripe-portal public-config \
            stripe-webhook revenuecat-webhook --project-ref "$SUPABASE_PROJECT_REF" --use-api
          # function secrets, copied from GitHub when they exist (without them, that part simply stays off)
          args=()
          for name in GITHUB_DISPATCH_TOKEN ADMIN_ORIGIN STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID STRIPE_PORTAL_LOGIN_URL \
                      REVENUECAT_WEBHOOK_AUTH REVENUECAT_SECRET_KEY; do
            [ -n "${!name}" ] && args+=("$name=${!name}")
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "${args[@]}"; fi

      - name: Import content (exit 2 = imported, but something needs a person; see the summary)
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then npm run import -- --dry-run; else npm run import; fi
