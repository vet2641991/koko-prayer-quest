# Shared steps of the store build workflows: install the app, write the public Koko Premium keys into this build's
# app.json, and check that EAS will upload only app/ and packages/shared (never the site's audio/ and media/).
# Run after actions/checkout. Every input is public by design or a token passed to EAS only.
name: Prepare the Koko app for an EAS build
description: Install, add the public keys, check the upload.

inputs:
  platform:
    description: android or ios
    required: true
  profile:
    description: EAS build profile (eas.json)
    required: true
  expo-token:
    description: EXPO_TOKEN
    required: true
  supabase-publishable-key:
    description: vars.SUPABASE_PUBLISHABLE_KEY (sb_publishable_…)
    required: false
    default: ''
  revenuecat-android-key:
    description: vars.REVENUECAT_ANDROID_PUBLIC_KEY (goog_…)
    required: false
    default: ''
  revenuecat-ios-key:
    description: vars.REVENUECAT_IOS_PUBLIC_KEY (appl_…)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install
      shell: bash
      working-directory: app
      run: npm ci

    - name: Check the EAS project link
      shell: bash
      working-directory: app
      run: |
        jq -e '.expo.extra.eas.projectId' app.json > /dev/null \
          || { echo "::error::app/app.json has no expo.extra.eas.projectId. Run the \"App test build (Android APK)\" workflow once first."; exit 1; }

    - name: Koko Premium keys (public by design; from the repository's Variables)
      shell: bash
      working-directory: app
      env:
        SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        REVENUECAT_ANDROID_KEY: ${{ inputs.revenuecat-android-key }}
        REVENUECAT_IOS_KEY: ${{ inputs.revenuecat-ios-key }}
      run: |
        # written into this build's app.json only (never committed); without them the app has no subscription
        case "$SUPABASE_PUBLISHABLE_KEY" in sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY must be the publishable key"; exit 1;; esac
        jq '.expo.extra += ({supabasePublishableKey: env.SUPABASE_PUBLISHABLE_KEY, revenuecatAndroidKey: env.REVENUECAT_ANDROID_KEY,
              revenuecatIosKey: env.REVENUECAT_IOS_KEY} | with_entries(select(.value != "" and .value != null)))' app.json > app.json.new
        mv app.json.new app.json
        echo "Keys in this build: $(jq -r '.expo.extra | keys - ["eas"] | join(", ")' app.json)"

    - name: Check what will be uploaded (app/ and packages/shared only)
      shell: bash
      working-directory: app
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        PLATFORM: ${{ inputs.platform }}
        PROFILE: ${{ inputs.profile }}
      run: |
        out="$RUNNER_TEMP/eas-archive"
        npx --yes eas-cli@25.3.0 build:inspect --platform "$PLATFORM" --profile "$PROFILE" --stage archive --output "$out"
        echo "Archive: $(find "$out" -type f | wc -l) files"; find "$out" -maxdepth 2 | sort
        test -f "$out"/app/package.json && test -f "$out"/app/app.json && test -d "$out"/packages/shared/src \
          || { echo "::error::The EAS archive is missing app/ or packages/shared: check .easignore."; exit 1; }
        if [ -e "$out"/audio ] || [ -e "$out"/media ]; then echo "::error::The site's audio/media would be uploaded: check .easignore."; exit 1; fi
        rm -rf "$out"
